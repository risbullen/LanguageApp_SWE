name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      TTS_ENGINE: ${{ secrets.GOOGLE_TTS_API_KEY != '' && 'google' || 'piper' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # ── Pre-generated speech (Piper, free + offline). Never blocks a deploy: if any of
      #    this fails, the app falls back to the live voice. ──
      - name: List texts to speak
        run: npx tsx scripts/audio-texts.ts
      - name: Restore generated audio
        uses: actions/cache@v4
        with:
          path: |
            public/audio
            voices
          key: audio-v2-${{ env.TTS_ENGINE }}-${{ hashFiles('audio-texts.json', 'scripts/gen_audio*.py') }}
          restore-keys: audio-v2-${{ env.TTS_ENGINE }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Google Cloud voices (Chirp 3 HD) when the GOOGLE_TTS_API_KEY secret exists
      - name: Generate audio with Google Cloud voices
        if: env.TTS_ENGINE == 'google'
        continue-on-error: true
        run: python scripts/gen_audio_google.py audio-texts.json public/audio && du -sh public/audio
      # otherwise Piper (free, offline)
      - name: Generate audio with Piper
        if: env.TTS_ENGINE == 'piper'
        continue-on-error: true
        run: |
          set -e
          sudo apt-get install -y -qq ffmpeg >/dev/null || true
          pip install -q piper-tts
          mkdir -p voices
          # every medium-quality Swedish voice (different speakers = more varied listening)
          for v in $(python -m piper.download_voices | grep -E '^sv_SE-.*-medium$' | head -3); do
            [ -f "voices/$v.onnx" ] || python -m piper.download_voices "$v" --data-dir voices
          done
          ls voices
          python scripts/gen_audio.py audio-texts.json voices public/audio
          du -sh public/audio

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
